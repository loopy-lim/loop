# Business logic selects compute classes. Concrete provider/model identifiers live here.
# Routing policy (2026-09-30, final decision): the balanced/strong compute
# classes list the pi openai-codex gpt-6.1-sol lane first (pi pattern syntax
# "openai-codex/gpt-6.1-sol:<thinking>", ChatGPT native login; smoke evidence
# OK-SOL-PI on pi 0.87.1) and the zai volume lane ("zai/glm-5.3-flashx",
# ":<thinking>") is demoted to fallback. The gpt lane runs the fast thinking
# profile (:minimal/:low) for these classes. fast/tiny keep their zai/glm
# primaries — fast's gpt entry is only the low-effort "fast option"
# (gpt-6.1-sol:minimal) fallback and tiny keeps the gpt-6-luna fallback — and
# frontier stays on bare gpt-6.1-sol. routing.default_compute_class stays
# "balanced" (an earlier "fast" switch was reverted the same day). Quota
# headroom on the gpt lane (2026-09-30, user decision) motivated the
# gpt-primary promotion. Antigravity profiles are no longer fallback
# candidates; the antigravity provider configuration itself is retained. The
# codex-exec provider lane was removed (2026-09): gpt-6 traffic runs solely on
# the pi openai-codex lane.

# pi catalog provisioning (2026-09-22 model-environment decision): ids below
# that are missing from pi's built-in catalogs are synced into pi's
# models.json (PI_CODING_AGENT_DIR/models.json, default ~/.pi/agent) by the
# provider adapter layer, removing the "Using custom model id" warning and its
# wrong-metadata fallback. Bare ids (no "provider/" prefix) resolve against
# default_provider. Declare metadata ONLY for ids the built-in catalog lacks;
# a metadata-less id relies on the built-in catalog unchanged. Metadata below
# mirrors pi's built-in glm-5.3-flash with cost scaled by the 2.5x flashx
# quota ratio noted on the entries (smoke-verified, tunable here).
[pi]
default_provider = "zai"

[pi.models."glm-5.3-flashx"]
name = "GLM-5.3-FlashX"
reasoning = true
context_window = 1000000
max_tokens = 131072
input = ["text"]
cost = { input = 0.375, output = 1.25, cache_read = 0.075, cache_write = 0 }

[pi.models."glm-5.3-flashx".compat]
supports_store = false
supports_developer_role = false
supports_reasoning_effort = true
max_tokens_field = "max_tokens"
thinking_format = "zai"
supports_strict_mode = true
zai_tool_stream = true

[[models]]
id = "deterministic-local"
provider = "local"
compute_class = "deterministic"
capabilities = { coding = 0, reasoning = 0, tools = 0, vision = 0, long_context = 0 }
latency = 0
cost_weight = 0

# glm-5.3-flashx consumes 2.5x the quota of regular flash per call (smoke-verified).
[[models]]
id = "glm-5.3-flashx"
provider = "pi"
compute_class = "typed_decision"
capabilities = { coding = 3, reasoning = 3, tools = 2, vision = 0, long_context = 3 }
latency = 1
cost_weight = 1

[[models]]
id = "zai/glm-5.3-flashx:off"
provider = "pi"
compute_class = "tiny"
capabilities = { coding = 2, reasoning = 2, tools = 2, vision = 0, long_context = 3 }
latency = 1
cost_weight = 1

[[models]]
id = "zai/glm-5.3-flashx"
provider = "pi"
compute_class = "fast"
capabilities = { coding = 3, reasoning = 3, tools = 2, vision = 0, long_context = 3 }
latency = 1
cost_weight = 1

# Fast-class gpt fallback: the explicit :minimal thinking pattern is the
# low-effort "fast option" on the gpt lane (2026-09-30; fast stays zai/glm
# primary). Its cost/latency keep registry ordering behind the zai primary and
# ahead of the deeper luna fallback.
[[models]]
id = "openai-codex/gpt-6.1-sol:minimal"
provider = "pi"
compute_class = "fast"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 1
cost_weight = 2

# balanced primary (2026-09-30 gpt-primary promotion): the explicit :low
# thinking pattern keeps this profile distinct from the fast/strong/frontier
# sol entries while the lowest cost_weight/latency pair puts it first in
# registry ordering.
[[models]]
id = "openai-codex/gpt-6.1-sol:low"
provider = "pi"
compute_class = "balanced"
capabilities = { coding = 5, reasoning = 5, tools = 3, vision = 0, long_context = 5 }
latency = 1
cost_weight = 1

# strong primary (2026-09-30 gpt-primary promotion): the explicit :high
# thinking pattern keeps this profile distinct from the fast/balanced sol
# entries and from the frontier bare id while staying first in registry
# ordering.
[[models]]
id = "openai-codex/gpt-6.1-sol:high"
provider = "pi"
compute_class = "strong"
capabilities = { coding = 5, reasoning = 5, tools = 3, vision = 0, long_context = 5 }
latency = 1
cost_weight = 1

# flashx consumes 2.5x the quota of regular flash per call; this pattern was
# smoke-verified. Demoted to the balanced fallback (2026-09-30 gpt-primary
# promotion); the extra latency keeps registry ordering behind the
# gpt-6.1-sol:low primary while still absorbing zai-side overflow first.
[[models]]
id = "zai/glm-5.3-flashx:high"
provider = "pi"
compute_class = "balanced"
capabilities = { coding = 4, reasoning = 3, tools = 2, vision = 0, long_context = 5 }
latency = 2
cost_weight = 1

[[models]]
id = "zai/glm-5.3-flash"
provider = "pi"
compute_class = "balanced"
capabilities = { coding = 3, reasoning = 3, tools = 2, vision = 0, long_context = 3 }
latency = 2
cost_weight = 2

# zai strong lane: demoted to the strong fallback (2026-09-30 gpt-primary
# promotion). Same id as the balanced entry with an explicit higher thinking
# pattern, mirroring the flashx balanced/high split above; the higher
# cost_weight/latency keep registry ordering behind the gpt-6.1-sol:high
# primary.
[[models]]
id = "zai/glm-5.3-flash:high"
provider = "pi"
compute_class = "strong"
capabilities = { coding = 4, reasoning = 4, tools = 2, vision = 0, long_context = 5 }
latency = 2
cost_weight = 2

# Deep gpt-lane quota fallback for volume workers. Explicit thinking patterns
# keep these profiles distinct from each other and from the primaries; the
# luna entries carry higher cost_weight/latency so registry ordering places
# them behind the class primaries.
[[models]]
id = "openai-codex/gpt-6-luna:off"
provider = "pi"
compute_class = "tiny"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 2
cost_weight = 2

[[models]]
id = "openai-codex/gpt-6-luna:low"
provider = "pi"
compute_class = "fast"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 2
cost_weight = 2

[[models]]
id = "openai-codex/gpt-6-luna"
provider = "pi"
compute_class = "typed_decision"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 2
cost_weight = 2

[[models]]
id = "openai-codex/gpt-6-luna:high"
provider = "pi"
compute_class = "balanced"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 3
cost_weight = 2

# gpt-6 frontier lane: pi's openai-codex provider with ChatGPT native login
# (prior smoke evidence OK-SOL-PI on pi 0.87.1; gpt-6.1-sol now ships in pi's
# updated built-in catalog with thinkingLevelMap off=null, so the off suffix
# is never used). Per the 2026-09-22 model-environment decision no [pi.models]
# metadata is declared for ids the built-in catalog provides.
[[models]]
id = "openai-codex/gpt-6.1-sol"
provider = "pi"
compute_class = "frontier"
capabilities = { coding = 5, reasoning = 5, tools = 3, vision = 0, long_context = 5 }
latency = 3
cost_weight = 4
