# Business logic selects compute classes. Concrete provider/model identifiers live here.
# Mixed routing (2026-09-22): pi carries the zai volume classes (pi pattern
# syntax "zai/glm-5.3-flashx", ":<thinking>"), codex exec carries gpt-5.6
# luna/terra/sol (smoke-verified), and antigravity gemini remains fallback.

[[models]]
id = "deterministic-local"
provider = "local"
compute_class = "deterministic"
capabilities = { coding = 0, reasoning = 0, tools = 0, vision = 0, long_context = 0 }
latency = 0
cost_weight = 0

