# Business logic selects compute classes. Concrete provider/model identifiers live here.
# Mixed routing (2026-09-23): pi carries the zai volume classes (pi pattern
# syntax "zai/glm-5.3-flashx", ":<thinking>") plus the gpt-6 luna/sol primary
# lane (openai-codex, ChatGPT native login; smoke evidence OK-LUNA-PI /
# OK-SOL-PI on pi 0.87.1), codex exec retains the gpt-5.6 luna/terra/sol line
# plus gpt-6 fallback (smoke-verified), and antigravity gemini remains
# fallback.

# pi catalog provisioning (2026-09-22 model-environment decision): ids below
# that are missing from pi's built-in catalogs are synced into pi's
# models.json (PI_CODING_AGENT_DIR/models.json, default ~/.pi/agent) by the
# provider adapter layer, removing the "Using custom model id" warning and its
# wrong-metadata fallback. Bare ids (no "provider/" prefix) resolve against
# default_provider. Declare metadata ONLY for ids the built-in catalog lacks;
# a metadata-less id relies on the built-in catalog unchanged. Metadata below
# mirrors pi's built-in glm-5.3-flash with cost scaled by the 2.5x flashx
# quota ratio noted on the entries (smoke-verified, tunable here).
[pi]
default_provider = "zai"

[pi.models."glm-5.3-flashx"]
name = "GLM-5.3-FlashX"
reasoning = true
context_window = 1000000
max_tokens = 131072
input = ["text"]
cost = { input = 0.375, output = 1.25, cache_read = 0.075, cache_write = 0 }

[pi.models."glm-5.3-flashx".compat]
supports_store = false
supports_developer_role = false
supports_reasoning_effort = true
max_tokens_field = "max_tokens"
thinking_format = "zai"
supports_strict_mode = true
zai_tool_stream = true

[[models]]
id = "deterministic-local"
provider = "local"
compute_class = "deterministic"
capabilities = { coding = 0, reasoning = 0, tools = 0, vision = 0, long_context = 0 }
latency = 0
cost_weight = 0

# glm-5.3-flashx consumes 2.5x the quota of regular flash per call (smoke-verified).
[[models]]
id = "glm-5.3-flashx"
provider = "pi"
compute_class = "typed_decision"
capabilities = { coding = 3, reasoning = 3, tools = 2, vision = 0, long_context = 3 }
latency = 1
cost_weight = 1

[[models]]
id = "zai/glm-5.3-flashx:off"
provider = "pi"
compute_class = "tiny"
capabilities = { coding = 2, reasoning = 2, tools = 2, vision = 0, long_context = 3 }
latency = 1
cost_weight = 1

[[models]]
id = "zai/glm-5.3-flashx"
provider = "pi"
compute_class = "fast"
capabilities = { coding = 3, reasoning = 3, tools = 2, vision = 0, long_context = 3 }
latency = 1
cost_weight = 1

# flashx consumes 2.5x the quota of regular flash per call; this pattern was
# smoke-verified. Preferred balanced candidate so escalation absorbs surplus
# quota while zai/glm-5.3-flash and gemini-3.8-flash-high remain fallbacks.
[[models]]
id = "zai/glm-5.3-flashx:high"
provider = "pi"
compute_class = "balanced"
capabilities = { coding = 4, reasoning = 3, tools = 2, vision = 0, long_context = 5 }
latency = 1
cost_weight = 1

[[models]]
id = "zai/glm-5.3-flash"
provider = "pi"
compute_class = "balanced"
capabilities = { coding = 3, reasoning = 3, tools = 2, vision = 0, long_context = 3 }
latency = 1
cost_weight = 2

# zai strong lane (2026-09-25): keeps compute escalation inside the zai
# volume classes so verification-failure escalation does not drain the
# openai-codex quota. Same id as the balanced entry with an explicit higher
# thinking pattern, mirroring the flashx balanced/high split above.
[[models]]
id = "zai/glm-5.3-flash:high"
provider = "pi"
compute_class = "strong"
capabilities = { coding = 4, reasoning = 4, tools = 2, vision = 0, long_context = 5 }
latency = 1
cost_weight = 1

# Quota fallback for volume workers stays inside the requested compute class.
# Explicit thinking patterns keep these profiles distinct from the balanced lane.
[[models]]
id = "openai-codex/gpt-6-luna:off"
provider = "pi"
compute_class = "tiny"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 2
cost_weight = 2

[[models]]
id = "openai-codex/gpt-6-luna:low"
provider = "pi"
compute_class = "fast"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 2
cost_weight = 2

# gpt-6 luna/sol primary lane: pi's openai-codex provider with ChatGPT native
# login (smoke evidence OK-LUNA-PI / OK-SOL-PI, pi 0.87.1). Both ids ship in
# pi 0.87.1's built-in catalog, so per the 2026-09-22 model-environment
# decision no [pi.models] metadata is declared. Figures mirror the codex-lane
# gpt-6 fallback entries below.
[[models]]
id = "openai-codex/gpt-6-luna"
provider = "pi"
compute_class = "balanced"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 2
cost_weight = 2

[[models]]
id = "openai-codex/gpt-6-sol"
provider = "pi"
compute_class = "frontier"
capabilities = { coding = 5, reasoning = 5, tools = 3, vision = 0, long_context = 5 }
latency = 3
cost_weight = 4

# gpt-5.6 luna runs through `codex exec --json` with codex native ChatGPT login.
[[models]]
id = "gpt-5.6-luna"
provider = "codex"
compute_class = "balanced"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 2
cost_weight = 2

[[models]]
id = "gpt-5.6-terra"
provider = "codex"
compute_class = "strong"
capabilities = { coding = 5, reasoning = 5, tools = 3, vision = 0, long_context = 4 }
latency = 2
cost_weight = 3

[[models]]
id = "gpt-5.6-sol"
provider = "codex"
compute_class = "frontier"
capabilities = { coding = 5, reasoning = 5, tools = 3, vision = 0, long_context = 5 }
latency = 3
cost_weight = 4

# gpt-6 luna/sol fallback on the codex lane (codex exec --json, ChatGPT native
# login; smoke-verified OK-LUNA / OK-SOL on codex-cli 0.155.1). Primary gpt-6
# traffic runs on the pi lane above; the codex entries keep frontier
# escalation on a second lane (2026-09-23 decision).
[[models]]
id = "gpt-6-luna"
provider = "codex"
compute_class = "balanced"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 0, long_context = 4 }
latency = 2
cost_weight = 2

[[models]]
id = "gpt-6-sol"
provider = "codex"
compute_class = "frontier"
capabilities = { coding = 5, reasoning = 5, tools = 3, vision = 0, long_context = 5 }
latency = 3
cost_weight = 4

# Antigravity 영속 드라이버 후보(agy 사용량): codex 다음 순서의 대안으로 편성된다.

[[models]]
id = "gemini-3.8-flash-high"
provider = "antigravity"
compute_class = "balanced"
capabilities = { coding = 4, reasoning = 4, tools = 3, vision = 2, long_context = 4 }
latency = 2
cost_weight = 2

[[models]]
id = "gemini-3.1-pro-high"
provider = "antigravity"
compute_class = "strong"
capabilities = { coding = 5, reasoning = 5, tools = 4, vision = 4, long_context = 5 }
latency = 3
cost_weight = 3

[[models]]
id = "gemini-3.1-pro-low"
provider = "antigravity"
compute_class = "frontier"
capabilities = { coding = 5, reasoning = 5, tools = 4, vision = 4, long_context = 5 }
latency = 3
cost_weight = 4
