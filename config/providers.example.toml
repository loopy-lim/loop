# Copy to a user-local configuration file and keep credentials in the named
# environment variables or in each provider's native authentication store.

[lead]
command = "pi"
provider = "openai-codex"
model = "gpt-6.1-sol"

# Lead uses pi's built-in openai-codex catalog entry and native ChatGPT login.
# Custom worker model registration (2026-09-22 decision): every worker pattern
# in models.toml is resolved against pi's built-in provider catalog. Loop's
# adapters sync the active profiles from models.toml into a pi models.json
# fragment (upsert by id; built-in entries are kept), so ids missing from the
# catalog — like glm-5.3-flashx — spawn without the
# "Warning: Model ... not found ... Using custom model id." fallback and carry
# correct contextWindow/maxTokens/cost metadata. Never hand-edit
# ~/.pi/agent/models.json for Loop ids; models.toml stays the only id source.

# Named Lead personas: config-driven instruction layers for the pi Lead.
# The active persona's Markdown fragment is resolved relative to
# LOOP_CONFIG_DIR and composed into the Lead's system instructions each turn.
# Names pair with the persona-benchmark workflow profiles. Remove the
# [lead.persona] tables to run the built-in instructions unchanged.
[lead.persona]
active = "plan-first"

[lead.persona.files]
lead-default = "personas/lead-default.md"
plan-first = "personas/plan-first.md"
spike-first = "personas/spike-first.md"
tdd-first = "personas/tdd-first.md"

# zai 볼륨 클래스(flash/flashx)는 pi로 실행한다. interactive면 Herdr 탭에서 pi TUI가
# 보이고, process면 `pi -p` 헤드리스로 돈다. 모델 id는 pi 패턴 문법
# ("zai/glm-5.3-flashx", ":<thinking>")을 따른다.
[providers.pi]
command = "pi"
enabled = true
auth = "native"
mode = "interactive"


# Mixed routing (2026-09, updated after codex lane drop): pi runs the zai
# volume classes plus the gpt-6 luna/sol lane (openai-codex, ChatGPT native
# login; smoke evidence OK-LUNA-PI / OK-SOL-PI on pi 0.87.1). The codex-exec
# provider lane was dropped (2026-09) — models.toml no longer declares any
# codex-provider model entry. The block below is kept for reference only and
# is disabled. Credentials stay in codex's own auth store and are never logged
# or persisted by Loop.
[providers.codex]
command = "codex"
enabled = false
auth = "native"
mode = "exec"

# 영속 stream-json 드라이버(2026-09-21): 프로세스 하나로 대화를 이어가며
# agy 사용량을 소모한다. 키는 agy 네이티브 인증에만 존재한다.
[providers.antigravity]
command = "agy"
enabled = true
auth = "native"
mode = "persistent"

[providers.zai]
endpoint = "https://api.z.ai/api/paas/v4"
api_key_env = "ZAI_API_KEY"
enabled = false
auth = "api_key"
mode = "api"

[providers.zai_cli]
command = "zai"
enabled = false
auth = "native"
mode = "interactive"

# Portable config roots (multi-machine): the whole setup is two directories.
#   LOOP_CONFIG_DIR      this Loop config directory (models.toml, policy.toml,
#                        providers.toml, personas/)
#   PI_CODING_AGENT_DIR  the pi config root, default ~/.pi/agent (holds the
#                        synced models.json fragment and pi settings)
#   HERDR_*              workspace/pane context used for run reporting
# 'loop doctor' verifies that each set variable resolves to an existing,
# readable directory. Dotfile both directories and every machine reproduces
# the same Lead and worker behavior. See docs/environment-generalization.md.

# MCP passthrough (G8, docs/worker-mcp-config.md): Loop does not implement an
# MCP client or server and adds no [mcp] section here — that is a boundary
# rule, not a missing feature. Workers are full CLI harnesses (pi, codex, agy)
# that already speak MCP, and Loop passes the child environment through
# untouched. Declare MCP servers in each CLI's own native config (codex:
# ~/.codex/config.toml [mcp_servers]; pi: its own settings) and keep server
# credentials out of every Loop config file.
