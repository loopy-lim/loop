# Copy to a user-local configuration file and keep credentials in the named
# environment variables or in each provider's native authentication store.

[lead]
command = "pi"
provider = "zai"
model = "glm-5.3-flash"

# 모든 워커 클래스를 pi로 실행한다. interactive면 Herdr 탭에서 pi TUI가 보이고,
# process면 `pi -p` 헤드리스로 돈다. 모델 id는 pi 패턴 문법("zai/glm-5.3-flash")을 따른다.
[providers.pi]
command = "pi"
enabled = true
auth = "native"
mode = "interactive"

# pi-only routing (2026-09-21): workers run through pi; codex/agy adapters stay but disabled.
[providers.codex]
command = "codex"
enabled = false
auth = "native"
mode = "interactive"

[providers.antigravity]
command = "agy"
enabled = false
auth = "native"
mode = "interactive"

[providers.zai]
endpoint = "https://api.z.ai/api/paas/v4"
api_key_env = "ZAI_API_KEY"
enabled = false
auth = "api_key"
mode = "api"

[providers.zai_cli]
command = "zai"
enabled = false
auth = "native"
mode = "interactive"

[providers.jev]
endpoint = "http://127.0.0.1:8089"
enabled = false
fallback = "deterministic"
auth = "none"
mode = "api"
