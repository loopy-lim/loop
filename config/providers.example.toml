# Copy to a user-local configuration file and keep credentials in the named
# environment variables or in each provider's native authentication store.

[lead]
command = "pi"
provider = "zai"
model = "glm-5.3-flashx"

# zai 볼륨 클래스(flash/flashx)는 pi로 실행한다. interactive면 Herdr 탭에서 pi TUI가
# 보이고, process면 `pi -p` 헤드리스로 돈다. 모델 id는 pi 패턴 문법
# ("zai/glm-5.3-flashx", ":<thinking>")을 따른다.
[providers.pi]
command = "pi"
enabled = true
auth = "native"
mode = "interactive"

# Mixed routing (2026-09-22): pi runs the zai volume classes; codex exec mode
# runs gpt-5.6 luna/terra/sol. Codex native ChatGPT login is used; credentials
# stay in codex's own auth store and are never logged or persisted by Loop.
[providers.codex]
command = "codex"
enabled = true
auth = "native"
mode = "exec"

# 영속 stream-json 드라이버(2026-09-21): 프로세스 하나로 대화를 이어가며
# agy 사용량을 소모한다. 키는 agy 네이티브 인증에만 존재한다.
[providers.antigravity]
command = "agy"
enabled = true
auth = "native"
mode = "persistent"

[providers.zai]
endpoint = "https://api.z.ai/api/paas/v4"
api_key_env = "ZAI_API_KEY"
enabled = false
auth = "api_key"
mode = "api"

[providers.zai_cli]
command = "zai"
enabled = false
auth = "native"
mode = "interactive"
