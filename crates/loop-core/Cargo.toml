[package]
name = "loop-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "loop_core"
path = "src/lib.rs"

[dependencies]
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[[test]]
name = "scheduler_domain"
path = "tests/scheduler_domain.rs"

[[test]]
name = "event_reducer"
path = "tests/event_reducer.rs"

[[test]]
name = "cleanup_policy"
path = "tests/cleanup_policy.rs"

[[test]]
name = "benchmark_profile"
path = "tests/benchmark_profile.rs"

[[test]]
name = "benchmark_trace"
path = "tests/benchmark_trace.rs"

[lints]
workspace = true
